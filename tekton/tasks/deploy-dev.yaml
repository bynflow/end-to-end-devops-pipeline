apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-dev
  namespace: proj2-ci
spec:
  params:
    - name: namespace
      type: string
      default: proj2-dev
      description: Target Kubernetes namespace
    - name: deployment
      type: string
      default: proj2-app
      description: Target Deployment name
    - name: container
      type: string
      default: app
      description: Target container name inside the Deployment
    - name: image
      type: string
      description: Image repository (e.g. ghcr.io/org/repo)
    - name: tag
      type: string
      description: Immutable image tag (e.g. short SHA)
  workspaces:
    - name: source
      description: Workspace containing the repo (k8s manifests)
  steps:
    # Debugging paths
    - name: debug-workspace
      image: alpine:3.19
      workingDir: $(workspaces.source.path)
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          echo "PWD=$(pwd)"
          echo "List root:"
          ls -la
          echo "List k8s/dev:"
          ls -la k8s/dev || true
    # Apply namespace manifest (idempotent)
    - name: apply-namespace
      image: registry.k8s.io/kubectl:v1.29.0
      workingDir: $(workspaces.source.path)
      command: ["kubectl"]
      args: ["apply", "-f", "k8s/dev/namespace.yaml"]

    # Apply deployment manifest (base definition)
    - name: apply-deployment
      image: registry.k8s.io/kubectl:v1.29.0
      workingDir: $(workspaces.source.path)
      command: ["kubectl"]
      args: ["apply", "-f", "k8s/dev/deployment.yaml"]

    # Apply service manifest
    - name: apply-service
      image: registry.k8s.io/kubectl:v1.29.0
      workingDir: $(workspaces.source.path)
      command: ["kubectl"]
      args: ["apply", "-f", "k8s/dev/service.yaml"]

    # Pin immutable image tag at deploy time (reproducible + rollback-friendly)
    - name: pin-image
      image: registry.k8s.io/kubectl:v1.29.0
      command: ["kubectl"]
      args:
        - "-n"
        - "$(params.namespace)"
        - "set"
        - "image"
        - "deployment/$(params.deployment)"
        - "$(params.container)=$(params.image):$(params.tag)"

    # Wait for rollout to complete
    - name: rollout-status
      image: registry.k8s.io/kubectl:v1.29.0
      command: ["kubectl"]
      args:
        - "-n"
        - "$(params.namespace)"
        - "rollout"
        - "status"
        - "deployment/$(params.deployment)"
        - "--timeout=120s"
