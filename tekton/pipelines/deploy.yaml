apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: deploy
  namespace: proj2-ci
spec:
  params:
    - name: repo_url
      type: string
    - name: revision
      type: string
      default: main
    - name: environment
      type: string
    - name: approve_prod
      type: string
      default: "false"
    - name: image
      type: string
      default: ghcr.io/bynflow/end-to-end-devops-pipeline
    - name: tag
      type: string
      description: Immutable tag (sha-*)
  workspaces:
    - name: shared
  tasks:
    - name: fetch-repo
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo_url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared

    - name: guard-prod
      runAfter: [fetch-repo]
      taskRef:
        name: guard-prod
      params:
        - name: environment
          value: $(params.environment)
        - name: approve_prod
          value: $(params.approve_prod)

    - name: deploy
      runAfter: [guard-prod]
      taskRef:
        name: deploy
      params:
        - name: environment
          value: $(params.environment)
        - name: image
          value: $(params.image)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: source
          workspace: shared
