apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: deploy-run-
  namespace: proj2-ci
spec:
  taskRunTemplate:
    serviceAccountName: tekton-deployer
  pipelineRef:
    name: deploy
  params:
    - name: repo_url
      value: https://github.com/bynflow/end-to-end-devops-pipeline.git
    - name: revision
      value: main
    - name: environment
      value: dev
  workspaces:
    - name: shared
      persistentVolumeClaim:
        claimName: proj2-shared-ws
