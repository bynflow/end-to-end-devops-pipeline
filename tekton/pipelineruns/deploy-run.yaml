apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: deploy-run-
  namespace: proj2-ci
spec:
  taskRunTemplate:
    serviceAccountName: tekton-deployer

  pipelineRef:
    name: deploy

  params:
    - name: repo_url
      value: https://github.com/bynflow/end-to-end-devops-pipeline.git
    - name: revision
      value: main
    - name: environment
      value: dev
    - name: approve_prod
      value: "false"

    - name: image
      value: ghcr.io/bynflow/end-to-end-devops-pipeline
    - name: tag
      value: sha-ec5cb7c

  workspaces:
    - name: shared
      persistentVolumeClaim:
        claimName: proj2-shared-ws
