apiVersion: v1
kind: Service
metadata:
  name: proj2-svc
  namespace: proj2-dev
spec:
  selector:
    app: proj2-app              # Targets pods with this label
  ports:
    - name: http
      port: 80                  # Service port inside cluster
      targetPort: 5000          # Container port
  type: ClusterIP               # Internal cluster exposure only
